[package]
name = "time-engine-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
jiff = { version = "0.2", features = ["tzdb-bundle-always", "serde", "js"] }

[lints.cargo]
unused_dependencies = "allow"

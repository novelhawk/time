name: Preview

on: [pull_request]

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Deploy preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --name ${{ format('{0}', slice(github.event.pull_request.head.sha, 0, 7)) }}-time
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.preview-deployment-url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "✅ **Preview deploy complete!**
          - **Preview URL:** ${PREVIEW_URL}
          - **Commit Deployment URL:** ${DEPLOYMENT_URL}"
